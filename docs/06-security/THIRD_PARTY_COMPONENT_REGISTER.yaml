  decision: compare with internal durable workflow needs and operational cost
  notes: Do not treat docs as license clearance.
- id: opentelemetry
  repository: https://opentelemetry.io/
  role: telemetry APIs/SDKs
  observed_license: Project packages commonly Apache-2.0; verify each exact package
  status: architecture_candidate
  decision: use vendor-neutral instrumentation behind exporter abstraction
  notes: Do not log sensitive prompt/browser/desktop payloads.
- id: trivy
  repository: https://github.com/aquasecurity/trivy
  role: vulnerability and license scanner candidate
  observed_license: Apache-2.0 (reverify exact release)
  status: security_tool_candidate
  decision: evaluate as one scanner in CI; unknown license findings require manual
    review
  notes: Scanner classification is a signal, not a legal determination.
- id: openmausbot
  repository: https://github.com/milind-soni/OpenMausBot
  role: multi-agent desktop product shell and local harness
  observed_license: Apache-2.0 except enterprise/ source-available
  status: preferred_product_shell_candidate_pending_actual_repo_audit
  decision: prototype only if existing ORBIT shell is insufficient; sparse-checkout
    enterprise/ exclusion is mandatory
  notes: Public OSS edition uses Apache-2.0; enterprise/ is under separate source-available
    terms. Preserve LICENSE, NOTICE, LICENSING.md and third_party notices. No product
    trademark/mascot rights. Audit CLI plaintext and packaged desktop OS-backed credential
    paths; ORBIT must use approved vault.
- id: openclaw
  repository: https://github.com/openclaw/openclaw
  role: gateway, channels, model/provider plugins and skills ecosystem
  observed_license: MIT
  status: optional_runtime_candidate
  decision: use published SDK/client/protocol or external runtime adapter; selective
    package reuse only after dependency review
  notes: MIT repository metadata. Gateway/native extensions require separate trust;
    in-process plugins are trusted code, not sandboxed. ORBIT retains policy/task
    authority.
