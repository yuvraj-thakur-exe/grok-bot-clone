  role: native desktop accessibility driver
  observed_license: Apache-2.0
  status: researched_candidate
  decision: optional local driver; preserve license/NOTICE; pin binary digest
  notes: Not an agent or browser automation engine.
- id: agent-browser
  repository: https://github.com/vercel-labs/agent-browser
