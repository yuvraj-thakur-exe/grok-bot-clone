version: 1.0.0-draft
research_date: '2026-11-08'
policy: Research shortlist only. No component is approved for production or redistribution
  solely by appearing here. Revalidate exact packages, nested licenses, notices, asset/model/data
  terms, security posture and integration tests.
components:
